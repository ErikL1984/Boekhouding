# Nginx configuratie voor Privé Boekhoudprogramma
# Plaats dit bestand in /etc/nginx/sites-available/boekhouding
# Activeren: sudo ln -s /etc/nginx/sites-available/boekhouding /etc/nginx/sites-enabled/
# Herladen:  sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;    # Vervang door je domeinnaam of IP-adres

    # Leid HTTP om naar HTTPS (activeer zodra SSL is ingesteld)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upload limiet voor CSV bestanden
        client_max_body_size 10M;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}

